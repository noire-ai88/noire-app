<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<title>NOIRE — Personal Intelligence</title>
<meta name="theme-color" content="#090a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOIRE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/noire-192.png">

<style>
:root{--bg:#090a0c;--panel:#111316;--panel2:#171a1e;--line:#292b2e;--gold:#c5a879;--gold2:#e0c99f;--text:#f2efe9;--muted:#92939a;--danger:#d77b76}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:920px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px calc(18px + env(safe-area-inset-bottom))}
header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,10,12,.94);backdrop-filter:blur(16px);z-index:5}
.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border:1px solid var(--gold);border-radius:11px;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:22px}.brand-name{font-size:15px;letter-spacing:3px;font-weight:650}.brand-sub{font-size:9px;letter-spacing:1.8px;color:var(--muted);margin-top:3px}
.status{font-size:10px;letter-spacing:1px;color:var(--gold);border:1px solid #5b4c35;border-radius:30px;padding:7px 10px}
main{flex:1;padding:26px 0 18px}.hero{text-align:center;padding:35px 10px 26px}.hero-mark{font-family:Georgia,serif;font-size:48px;color:var(--gold);margin-bottom:12px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}.hero h1{font-size:25px;font-weight:500;letter-spacing:1px;margin:12px 0 8px}.hero p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 auto;max-width:420px}
.notice{border:1px solid #5a4930;background:#17140f;color:#d8c4a0;border-radius:12px;padding:11px 13px;font-size:11px;line-height:1.5;margin:0 auto 18px;max-width:650px}
.mode-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:650px;margin:0 auto 20px}.mode{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:12px 6px;text-align:center}.mode.active{border-color:var(--gold);color:var(--gold2);background:#19160f}.mode strong{display:block;font-size:11px;letter-spacing:1px}.mode small{display:block;font-size:10px;margin-top:5px}
.chat-wrap{max-width:720px;margin:0 auto}.messages{display:flex;flex-direction:column;gap:12px;padding:4px 0 16px}.msg{max-width:88%;padding:13px 15px;border-radius:15px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-top-left-radius:4px}.msg.user{align-self:flex-end;background:#29251e;border:1px solid #51432f;border-top-right-radius:4px}.msg-label{font-size:9px;letter-spacing:1.5px;color:var(--gold);margin-bottom:6px}
.composer{border:1px solid #39352e;background:var(--panel);border-radius:17px;padding:9px;display:flex;gap:8px;align-items:flex-end}.composer textarea{resize:none;min-height:42px;max-height:130px;flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:10px 7px;font-size:14px}.send{width:42px;height:42px;border:0;border-radius:12px;background:var(--gold);color:#15120d;font-size:18px;font-weight:700}.send:disabled{opacity:.4}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:30px;padding:8px 11px;font-size:11px}
.tabs{display:flex;gap:6px;overflow:auto;border-top:1px solid var(--line);padding:12px 0 4px;position:sticky;bottom:0;background:var(--bg)}.tab{flex:1;min-width:65px;border:0;background:transparent;color:var(--muted);padding:8px 5px;border-radius:10px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.tab-icon{font-size:21px;line-height:1.1;font-weight:400}.tab-icon-img{width:25px;height:25px;object-fit:contain;display:block}.tab.active{background:#1c1913;color:var(--gold2)}
.panel{max-width:650px;margin:12px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.panel h2{font-size:18px;font-weight:500;margin:0 0 6px}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 17px}.field{display:block;margin:15px 0}.field span{display:block;font-size:11px;color:var(--gold2);letter-spacing:.5px;margin-bottom:8px}.field input,.field textarea{width:100%;background:#0b0c0e;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;outline:none}.field textarea{min-height:130px;resize:vertical;line-height:1.5}.btn{border:1px solid #806b49;background:#211c14;color:var(--gold2);border-radius:10px;padding:11px 14px;font-size:12px}.btn.secondary{border-color:var(--line);background:transparent;color:var(--text)}.btn.danger{border-color:#653b39;color:#e2a19c;background:#1b1111}
.memory-item,.history-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.memory-item:last-child,.history-item:last-child{border:0}.muted{color:var(--muted);font-size:11px}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}
footer{text-align:center;color:#65666b;font-size:10px;padding:13px 0 5px;letter-spacing:.4px}
@media(min-width:700px){.hero{padding-top:48px}.hero h1{font-size:30px}.app{padding-left:24px;padding-right:24px}}
</style>
</head>

<script>
const KEY='veltrix_v01';
const defaults={mode:'CORE',instructions:'Ты — NOIRE, персональный интеллектуальный ассистент. Общайся на русском языке естественно, интеллектуально и доброжелательно. Будь точным, признавай неопределённость, не выдумывай факты. Проявляй инициативу, когда это полезно, но не навязывай советы. Сохраняй личные сведения только после явного разрешения пользователя.',memories:[],chats:[],activeChat:null,theme:'dark'};
let state;
try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...defaults}}
let tab='chat';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function active(){return state.chats.find(c=>c.id===state.activeChat)}
function newChat(){const c={id:Date.now(),title:'Новый диалог',messages:[]};state.chats.unshift(c);state.activeChat=c.id;save();render()}
function demoReply(text){
 const t=text.toLowerCase();
 if(t.includes('привет'))return 'Здравствуйте. Я NOIRE — ваш персональный интеллектуальный помощник. Сейчас я работаю в демонстрационном режиме: интерфейс и локальные функции доступны, но языковая модель ещё не подключена.';
 if(t.includes('режим'))return 'Сейчас доступны три профиля: CORE для повседневных задач, ANALYST для структурированного анализа и CREATIVE для генерации идей. Переключить их можно над окном переписки.';
 if(t.includes('памят'))return 'Управление памятью находится во вкладке «Память». В этой версии сведения добавляются только вручную, после вашего решения.';
 return 'Сообщение принято интерфейсом NOIRE. Это демонстрационный ответ, а не результат работы языковой модели. Следующий технический этап — подключить настоящий AI-движок через защищённый серверный API.';
}
function send(text){const c=active();if(!c||!text.trim())return;c.messages.push({role:'user',text:text.trim()});if(c.title==='Новый диалог')c.title=text.trim().slice(0,34);save();render();setTimeout(()=>{const now=active();if(!now||now.id!==c.id)return;now.messages.push({role:'ai',text:demoReply(text)});save();render()},350)}
function render(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const m=document.getElementById('main');
 if(tab==='chat'){
  if(!active()){m.innerHTML=`<section class="hero"><div class="hero-mark">V</div><div class="eyebrow">Personal Intelligence</div><h1>Добро пожаловать в NOIRE</h1><p>Ваше пространство для идей, анализа и осмысленных решений.</p></section>`}
  else m.innerHTML='';
  m.innerHTML+=`<div class="notice">Демонстрационный режим · Настоящая языковая модель пока не подключена. Сообщения и настройки сохраняются локально на этом устройстве.</div>
  <div class="mode-row">${[['CORE','Универсальный'],['ANALYST','Аналитика'],['CREATIVE','Творчество']].map(([x,y])=>`<button class="mode ${state.mode===x?'active':''}" data-mode="${x}"><strong>${x}</strong><small>${y}</small></button>`).join('')}</div>
  <div class="chat-wrap"><div class="messages" id="messages">${(active()?.messages||[]).map(x=>`<div class="msg ${x.role}">${x.role==='ai'?'<div class="msg-label">NOIRE</div>':''}${esc(x.text)}</div>`).join('')}</div>
  <div class="composer"><textarea id="prompt" placeholder="Спросите NOIRE о чём угодно…" rows="1"></textarea><button class="send" id="send" aria-label="Отправить">↑</button></div>
  <div class="quick"><button class="chip" data-prompt="Помоги структурировать мою идею.">Структурировать идею</button><button class="chip" data-prompt="Сравни несколько вариантов решения задачи.">Сравнить варианты</button><button class="chip" data-prompt="Составь план проекта по шагам.">Составить план</button></div></div>`;
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();render()});
  const input=document.getElementById('prompt');const btn=document.getElementById('send');
  const go=()=>{const v=input.value; if(v.trim()){if(!active())newChat();send(v)}};
  btn.onclick=go;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
  document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});
 }else if(tab==='history'){
  m.innerHTML=`<div class="panel"><h2>История диалогов</h2><p class="sub">Переписки хранятся локально в браузере этого устройства.</p><button class="btn" id="new">＋ Новый диалог</button><div style="margin-top:14px">${state.chats.length?state.chats.map(c=>`<div class="history-item"><button class="chip" data-open="${c.id}">${esc(c.title)}</button><button class="btn danger" data-delete="${c.id}">Удалить</button></div>`).join(''):'<div class="empty">Пока нет сохранённых диалогов.</div>'}</div></div>`;
  document.getElementById('new').onclick=newChat;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.activeChat=Number(b.dataset.open);tab='chat';save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.chats=state.chats.filter(c=>c.id!==Number(b.dataset.delete));if(state.activeChat===Number(b.dataset.delete))state.activeChat=null;save();render()});
 }else if(tab==='personality'){
  m.innerHTML=`<div class="panel"><h2>Личность NOIRE</h2><p class="sub">Настройте системную инструкцию. Она будет использоваться при подключении настоящей модели.</p><label class="field"><span>АКТИВНЫЙ ПРОФИЛЬ</span><input value="${state.mode}" disabled></label><label class="field"><span>СИСТЕМНАЯ ИНСТРУКЦИЯ</span><textarea id="instructions">${esc(state.instructions)}</textarea></label><button class="btn" id="saveprompt">Сохранить инструкцию</button> <button class="btn secondary" id="resetprompt">Сбросить</button><p class="muted" id="feedback"></p></div>`;
  document.getElementById('saveprompt').onclick=()=>{state.instructions=document.getElementById('instructions').value;save();document.getElementById('feedback').textContent='Инструкция сохранена на этом устройстве.'};document.getElementById('resetprompt').onclick=()=>{state.instructions=defaults.instructions;save();render()};
 }else if(tab==='memory'){
  m.innerHTML=`<div class="panel"><h2>Персональная память</h2><p class="sub">В этой версии память полностью контролируется вами. Добавляйте только то, что хотите сохранить на устройстве.</p><label class="field"><span>НОВАЯ ЗАПИСЬ</span><input id="memoryInput" placeholder="Например: предпочитаю краткие ответы"></label><button class="btn" id="addMemory">＋ Сохранить запись</button><div style="margin-top:18px"><div class="eyebrow">СОХРАНЁННЫЕ ЗАПИСИ</div>${state.memories.length?state.memories.map((x,i)=>`<div class="memory-item"><span>${esc(x)}</span><button class="btn danger" data-remove="${i}">Удалить</button></div>`).join(''):'<div class="empty">Память пока пуста.</div>'}</div></div>`;
  document.getElementById('addMemory').onclick=()=>{const v=document.getElementById('memoryInput').value.trim();if(v){state.memories.push(v);save();render()}};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.memories.splice(Number(b.dataset.remove),1);save();render()});
 }else if(tab==='settings'){
  m.innerHTML=`<div class="panel"><h2>Настройки</h2><p class="sub">Управление локальными данными и прототипом.</p><div class="memory-item"><span>Язык интерфейса</span><strong>Русский</strong></div><div class="memory-item"><span>Оформление</span><strong>Obsidian / Champagne</strong></div><div class="memory-item"><span>Хранение</span><strong>Локально</strong></div><div class="memory-item"><span>Версия</span><strong>0.1 Prototype</strong></div><p class="sub" style="margin-top:18px">Данные хранятся в LocalStorage браузера. Очистка данных сайта может удалить переписки и настройки.</p><button class="btn danger" id="clear">Очистить все локальные данные</button></div>`;
  document.getElementById('clear').onclick=()=>{if(confirm('Удалить все локальные данные NOIRE?')){localStorage.removeItem(KEY);state={...defaults};render()}};
 }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if(!state.activeChat&&state.chats.length)state.activeChat=state.chats[0].id;
render();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
\n<script>
const NOIRE_SERVER = "ВСТАВЬ_АДРЕС_СВОЕГО_WORKER";

async function sendToNoire(message) {
  const response = await fetch(NOIRE_SERVER + "/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message })
  });

  if (!response.ok) throw new Error("Server error");
  return await response.json();
}
</script>
